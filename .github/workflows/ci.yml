name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Solo para que AddInfrastructure no falle al construir el host en `dotnet ef`; no se conecta.
      ConnectionStrings__Default: "Server=ci;Database=Local133;Trusted_Connection=True;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (advertencias = errores)
        run: dotnet build -c Release --no-restore

      - name: Migraciones al día con el modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --configuration Release --no-build \
            --project src/Local133.Infrastructure --startup-project src/Local133.Api

      # Aún no hay proyectos de prueba (se crean en Fase 1); el paso queda listo.
      - name: Tests
        run: dotnet test -c Release --no-build

  spa:
    name: SPA lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Local133.CustomerPortal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Local133.CustomerPortal/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
