name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Solo para que AddInfrastructure no falle al construir el host en `dotnet ef`; no se conecta.
      ConnectionStrings__Default: "Server=ci;Database=Local133;Trusted_Connection=True;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build (advertencias = errores)
        run: dotnet build -c Release --no-restore

      - name: Migraciones al día con el modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --configuration Release --no-build \
            --project src/Local133.Infrastructure --startup-project src/Local133.Web

      # CI no tiene SQL Server: las pruebas que lo usan (Trait Category=SqlServer, base Local133_Tests)
      # solo corren en local con `dotnet test`.
      - name: Tests
        run: dotnet test -c Release --no-build --filter "Category!=SqlServer"
